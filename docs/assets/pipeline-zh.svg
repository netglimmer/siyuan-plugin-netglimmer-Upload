  <text x="368" y="185" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="600" fill="#5b5bd6">HTML (SiYuan) · 推荐</text>
  <rect x="356" y="200" width="200" height="28" rx="7" fill="#e6f6ee"/>
  <text x="368" y="219" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="600" fill="#2f9e6f">Markdown</text>
  <rect x="356" y="234" width="200" height="28" rx="7" fill="#eef0f4"/>
  <text x="368" y="253" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="600" fill="#4b5566">Word (.docx)</text>
  <line x1="576" y1="195" x2="616" y2="195" stroke="#8b7cf7" stroke-width="3" stroke-linecap="round"/><path d="M609 188 L617 195 L609 202" fill="none" stroke="#8b7cf7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
