  <text x="668" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#1c2027">上传协议</text>
  <rect x="644" y="166" width="96" height="28" rx="7" fill="#eef0f4"/>
  <text x="692.0" y="185" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="600" fill="#4b5566">WebDAV</text>
  <rect x="744" y="166" width="96" height="28" rx="7" fill="#eef0f4"/>
  <text x="792.0" y="185" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="600" fill="#4b5566">FTP</text>
  <rect x="644" y="200" width="96" height="28" rx="7" fill="#eef0f4"/>
  <text x="692.0" y="219" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="600" fill="#4b5566">SFTP</text>
  <rect x="744" y="200" width="96" height="28" rx="7" fill="#eef0f4"/>
  <text x="792.0" y="219" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="600" fill="#4b5566">本地目录</text>
  <text x="644" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#7b8698">并发 / 重试 / 读回校验</text>
  <line x1="864" y1="195" x2="904" y2="195" stroke="#8b7cf7" stroke-width="3" stroke-linecap="round"/><path d="M897 188 L905 195 L897 202" fill="none" stroke="#8b7cf7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="912" y="120" width="240" height="150" rx="14" fill="#ffffff" stroke="#e2e6ee"/>
  <circle cx="934" cy="144" r="13" fill="#eeeefc"/>
  <text x="934" y="149" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#5b5bd6">4</text>
  <text x="956" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#1c2027">服务器目录</text>
  <text x="932" y="184" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#4b5566">静态目录或站点根</text>
  <text x="932" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#4b5566">浏览器直接打开</text>
  <text x="932" y="232" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#7b8698">看板可重试、可清理</text>
