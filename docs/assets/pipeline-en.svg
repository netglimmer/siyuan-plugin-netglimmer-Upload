<text x="48" y="87" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#4b5566">Export → upload → verify → dashboard. Repeat uploads reuse unchanged files.</text>
